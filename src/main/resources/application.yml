server:
  port: 10086

spring:
  application:
    name: admin-core-be
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  data:
    redis:
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 2s
  mail:
    host: ${SPRING_MAIL_HOST:118.128.208.148}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:server@easyshop.co.kr}
    password: ${SPRING_MAIL_PASSWORD:kicc3124!}

security:
  jwt:
    secret: ${JWT_SECRET:admin-core-local-jwt-secret-key-minimum-32-characters}
    issuer: admin-core-be
    access-token-expiration: 30m
    refresh-token-expiration: 7d
    pre-auth-expiration: 5m
  trusted-proxy:
    enabled: ${TRUSTED_PROXY_ENABLED:false}
  cors:
    allowed-origins:
      - ${ADMIN_FRONTEND_ORIGIN:http://localhost:13011}
  refresh-cookie:
    name: admin_refresh_token
    secure: true
    same-site: Strict
    path: /api/v1/auth

otp:
  service-name: ADMIN-CORE
  issuer: admin-core
  qr-size: 250
  max-failed-attempts: 5

management:
  server:
    port: 11086
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/docu
    persist-authorization: true

logging:
  level:
    com.espay.admincore: INFO
