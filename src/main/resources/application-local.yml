spring:
  datasource:
    url: jdbc:mariadb://localhost:13308/${ADMIN_CORE_DB_NAME:admin_core}?allowPublicKeyRetrieval=true&useSSL=false
    username: ${ADMIN_CORE_DB_USER:admin_core}
    password: ${ADMIN_CORE_DB_PASSWORD:admin_core}
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: ${ADMIN_CORE_REDIS_HOST:localhost}
      port: ${ADMIN_CORE_REDIS_PORT:16380}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema/admin_core_schema.sql

security:
  refresh-cookie:
    secure: false
