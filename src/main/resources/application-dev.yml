spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: never

security:
  cors:
    allowed-origins:
      - ${ADMIN_FRONTEND_ORIGIN}
  refresh-cookie:
    secure: true
