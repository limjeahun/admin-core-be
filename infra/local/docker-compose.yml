services:
  mariadb:
    image: mariadb:11.4
    container_name: admin-core-mariadb
    environment:
      MARIADB_DATABASE: admin_core
      MARIADB_USER: admin_core
      MARIADB_PASSWORD: admin_core
      MARIADB_ROOT_PASSWORD: admin_core
      TZ: Asia/Seoul
    ports:
      - "13308:3306"
    volumes:
      - admin-core-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: admin-core-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16380:6379"
    volumes:
      - admin-core-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  admin-core-mariadb-data:
  admin-core-redis-data:
